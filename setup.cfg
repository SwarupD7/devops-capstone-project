
[nosetests]
verbosity=1
with-spec=1
spec-color=1
with-coverage=1
cover-package=service
cover-erase=1

[coverage:run]
source = service
omit = */__init__.py

[coverage:report]
show_missing = True
fail_under = 95
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:

[flake8]
per-file-ignores =
    */__init__.py: F401 E402
max-line-length = 120
exclude = .git,__pycache__,venv,.venv

[pylint]
disable = E1101
